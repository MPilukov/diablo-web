server {
    listen 80;
    root /usr/share/nginx/html;
    # relative Location: behind the platform gateway the Host header is the
    # container address, not the public one
    absolute_redirect off;

    # the build was made for https://d07riv.github.io/diabloweb, so every
    # asset path starts with /diabloweb/
    location = / {
        return 302 /diabloweb/;
    }

    location /diabloweb/ {
        try_files $uri $uri/ /diabloweb/index.html;
    }

    location = /diabloweb/spawn.mpq {
        add_header Cache-Control "public, max-age=604800";
    }
}
